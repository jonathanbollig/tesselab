# Uploads Tesselab to PyPI. It never runs on a push: only when you start it by hand (Actions > "Publish to PyPI" >
# Run workflow, choose testpypi or pypi) or when you publish a GitHub release (then it uploads to pypi).
# No password or token is stored anywhere: PyPI trusts this workflow ("trusted publishing"), see CLAUDE.md > Releasing.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag of a release must be v<version>
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("src/tesselab/__init__.py").read()).group(1))')
          echo "tag $TAG, version $version"
          test "$TAG" = "v$version"
      - name: Build the wheel and the source archive
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
